[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "deezer-technical-test"
version = "0.1.0"
description = "Projet Deezer - Test technique"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vincent RICHARD", email = "vincent.richard.contact@gmail.com" }
]
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "scipy>=1.14",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
pretty = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
]